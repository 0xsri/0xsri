<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" fill="none" role="img">
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
</style>
<defs>
  <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#120B2E"/><stop offset="1" stop-color="#1C1240"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#F97316"/>
  </linearGradient>
</defs>
<rect x="0.5" y="0.5" width="899" height="199" rx="14" fill="url(#cardBg)" stroke="#3B2A6B"/>
<rect x="0.5" y="0.5" width="899" height="3" rx="1.5" fill="url(#edge)" opacity=".9"/>
<line x1="300" y1="40" x2="300" y2="160" stroke="#3B2A6B"/><line x1="600" y1="40" x2="600" y2="160" stroke="#3B2A6B"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.20s" dur=".8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.20s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
  <text x="150" y="96" text-anchor="middle" font-size="40" font-weight="800" fill="#A78BFA">441</text>
  <text x="150" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#E5E7EB">Total Contributions</text>
  <text x="150" y="152" text-anchor="middle" font-size="12" fill="#A1A1AA">Feb 17, 2025 – Present</text>
</g>
<defs><linearGradient id="streakRing" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#F97316"/></linearGradient></defs>
<circle cx="450" cy="82" r="44" stroke="#2E2357" stroke-width="7"/>
<circle cx="450" cy="82" r="44" stroke="url(#streakRing)" stroke-width="7" stroke-linecap="round"
  stroke-dasharray="276.5" stroke-dashoffset="60.8" transform="rotate(-90 450 82)">
  <animate attributeName="stroke-dashoffset" from="276.5" to="60.8" dur="1.6s" begin="0.4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
</circle>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.70s" dur=".8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.70s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/><text x="450" y="92" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">117</text></g>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.90s" dur=".8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.90s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/><text x="450" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#F97316">Active Days</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.00s" dur=".8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="1.00s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/><text x="450" y="178" text-anchor="middle" font-size="12" fill="#A1A1AA">days with contributions</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.60s" dur=".8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.60s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
  <text x="750" y="96" text-anchor="middle" font-size="40" font-weight="800" fill="#A78BFA">6 days</text>
  <text x="750" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#E5E7EB">Longest Streak</text>
  <text x="750" y="152" text-anchor="middle" font-size="12" fill="#A1A1AA">May 15 – May 20, 2026</text>
</g>
</svg>
